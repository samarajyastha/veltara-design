<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Veltara Consultants" />
    <meta name="keywords" content="Study Abroad, Consultancy" />

    <title>Veltara Consultants</title>
    <link rel="icon" href="/favicon.ico" type="image/x-icon" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
    />
  </head>
  <body>
    <!-- Header start  -->
    <header>
      <nav
        class="bg-white fixed w-full z-20 top-0 start-0 border-b border-gray-200"
      >
        <div
          class="max-w-screen-xl flex flex-wrap items-center justify-between mx-auto p-4"
        >
          <a
            href="#home"
            class="flex items-center space-x-3 rtl:space-x-reverse"
          >
            <img src="images/logo.png" class="h-8" alt="Flowbite Logo" />
            <span class="self-center text-xl font-semibold whitespace-nowrap"
              >Veltara Consultants</span
            >
          </a>
          <div
            class="flex md:order-2 space-x-3 md:space-x-0 rtl:space-x-reverse"
          >
            <button
              type="button"
              class="text-white bg-[#286291] hover:bg-[#204e74] font-medium rounded-full text-sm px-4 py-2 text-center"
            >
              <i class="fa fa-phone"></i>
              Call Now
            </button>
            <button
              data-collapse-toggle="navbar-sticky"
              type="button"
              class="inline-flex items-center p-2 w-10 h-10 justify-center text-sm text-gray-500 rounded-lg md:hidden hover:bg-gray-100"
              aria-controls="navbar-sticky"
              aria-expanded="false"
            >
              <span class="sr-only">Open main menu</span>
              <svg
                class="w-5 h-5"
                aria-hidden="true"
                xmlns="http://www.w3.org/2000/svg"
                fill="none"
                viewBox="0 0 17 14"
              >
                <path
                  stroke="currentColor"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M1 1h15M1 7h15M1 13h15"
                />
              </svg>
            </button>
          </div>
          <div
            class="items-center justify-between hidden w-full md:flex md:w-auto md:order-1"
            id="navbar-sticky"
          >
            <ul
              class="flex flex-col p-4 md:p-0 mt-4 font-medium border border-gray-100 rounded-lg bg-gray-50 md:space-x-8 rtl:space-x-reverse md:flex-row md:mt-0 md:border-0 md:bg-white"
            >
              <li>
                <a
                  href="#"
                  class="block py-2 px-3 text-white bg-[#286291] rounded-sm md:bg-transparent md:text-[#286291] md:p-0"
                  aria-current="page"
                  >Home</a
                >
              </li>
              <li>
                <a
                  href="#"
                  class="block py-2 px-3 text-gray-900 rounded-sm hover:bg-gray-100 md:hover:bg-transparent md:hover:text-[#286291] md:p-0"
                  >About</a
                >
              </li>
              <li>
                <a
                  href="#"
                  class="block py-2 px-3 text-gray-900 rounded-sm hover:bg-gray-100 md:hover:bg-transparent md:hover:text-[#286291] md:p-0"
                  >Services</a
                >
              </li>
              <li>
                <a
                  href="#"
                  class="block py-2 px-3 text-gray-900 rounded-sm hover:bg-gray-100 md:hover:bg-transparent md:hover:text-[#286291] md:p-0"
                  >Contact</a
                >
              </li>
            </ul>
          </div>
        </div>
      </nav>
    </header>
    <!-- Header end  -->

    <!-- Main content start  -->
    <main>
      <section id="hero">
        <div class="container mx-auto max-w-screen-xl px-5">
          <div
            class="grid grid-cols-1 lg:grid-cols-2 gap-5 h-screen items-center"
          >
            <div class="flex flex-col justify-center items-start py-32">
              <h2 class="text-5xl font-bold">
                Grab the Great Opportunity to
                <span class="text-[#286291]">Study Abroad</span>
              </h2>
              <p class="text-zinc-600 mt-5">
                <span class="font-bold block text-zinc-900"
                  >Veltara Consultants!</span
                >
                Your trusted educational consultancy for studying abroad.
              </p>

              <!-- <h1 class="text-6xl font-bold mt-5">Veltara Consultants</h1> -->

              <div class="flex mt-6 gap-4">
                <button
                  type="button"
                  class="text-white bg-black hover:bg-black/80 font-medium rounded-full text-sm px-5 py-2.5 text-center flex items-center gap-2"
                >
                  <img src="/images/whatsapp-logo.svg" alt="" class="w-5 h-5" />
                  <span class="border-l-1 pl-2">WhatsApp Us</span>
                </button>

                <a
                  href="#services"
                  class="text-black border border-2 border-black hover:underline font-medium rounded-full text-sm px-5 py-2.5 text-center"
                >
                  Services
                </a>
              </div>
            </div>
            <div
              class="h-[80vh] py-16 md:px-5 overflow-hidden rounded-2xl flex justify-center relative"
            >
              <div
                class="absolute bottom-3 left-0 md:left-15 border border-2 border-[#286291] shadow-lg rounded-2xl bg-white px-7 py-3 text-xl font-semibold"
              >
                <p class="text-[#286291]">10+ Years</p>
                <p>Experience</p>
              </div>
              <div
                class="grid grid-cols-7 w-full h-full gap-5 justify-items-center items-center absolute top-0 left-0"
              >
                <div></div>
                <i
                  class="text-5xl text-gray-700 fa fa-plane"
                  aria-hidden="true"
                ></i>
                <div></div>
                <div></div>
                <div></div>
                <div></div>
                <div></div>
                <div></div>
                <div></div>
                <div></div>
                <div></div>
                <div></div>
                <div></div>
                <i
                  class="text-5xl text-gray-700 fa fa-globe-americas"
                  aria-hidden="true"
                ></i>
                <i
                  class="text-5xl text-gray-700 fa fa-graduation-cap"
                  aria-hidden="true"
                ></i>
                <div></div>
                <div></div>
                <div></div>
                <div></div>
                <div></div>
                <div></div>
                <div></div>
                <div></div>
                <div></div>
                <div></div>
                <div></div>
                <i
                  class="text-5xl text-gray-700 fa fa-user-graduate"
                  aria-hidden="true"
                ></i>
                <div></div>
                <div></div>
                <div></div>
                <div></div>
                <div></div>
                <div></div>
                <div></div>
                <div></div>
                <div></div>
                <div></div>
                <div></div>
                <i
                  class="text-5xl text-gray-700 fa fa-globe"
                  aria-hidden="true"
                ></i>
                <div></div>
                <div></div>
                <i
                  class="text-5xl text-gray-700 fa fa-university"
                  aria-hidden="true"
                ></i>
              </div>

              <img
                src="/images/hero.jpg"
                alt="Hero Image"
                class="h-full md:w-3/4 rounded-2xl object-cover object-center"
              />
            </div>
          </div>
        </div>
      </section>
      <!-- Hero section end  -->
    </main>
    <!-- Main content end  -->

    <!-- Footer start  -->
    <footer></footer>
    <!-- Footer end  -->
  </body>
</html>
